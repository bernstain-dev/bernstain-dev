<svg xmlns="http://www.w3.org/2000/svg" width="980" height="510" viewBox="0 0 980 510" role="img" aria-labelledby="title desc">
<title id="title">Bernstain O. Fangon — Full Stack Developer</title><desc id="desc">A stylized request and response moves between frontend, backend, and database layers. This is a decorative animation.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#25354c" stroke-width="0.6" opacity="0.25"/></pattern>
  <linearGradient id="accent"><stop stop-color="#54d7f5"/><stop offset="0.55" stop-color="#b99aff"/><stop offset="1" stop-color="#63e5b5"/></linearGradient>
</defs>
<style>
 .cursor { animation: blink 1.3s steps(1) infinite; }
 .status { animation: pulse 3s ease-in-out infinite; }
 @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
 @keyframes pulse { 0%,100% { opacity:0.6 } 50% { opacity:1 } }
 @media (prefers-reduced-motion: reduce) { .cursor,.status { animation:none; } .packet { display:none; } }
</style>
<rect x="1" y="1" width="978" height="508" rx="22" fill="#0b1220" stroke="#25354c"/>
<rect x="2" y="2" width="976" height="506" rx="21" fill="url(#grid)"/>
<rect x="34" y="32" width="5" height="32" rx="2" fill="url(#accent)"/><text x="53" y="53" fill="#a6b6ce" font-size="12" font-weight="700" font-family="'Courier New',monospace">BERNSTAIN / THE BUILD LOG</text><circle class="status" cx="804" cy="49" r="4" fill="#63e5b5"/><text x="817" y="53" fill="#63e5b5" font-size="10" font-weight="700" font-family="'Courier New',monospace">BUILDING &amp; LEARNING</text><text x="42" y="123" fill="#eaf2ff" font-size="49" font-weight="700" font-family="Arial,Helvetica,sans-serif">Bernstain O. Fangon</text><text x="44" y="164" fill="#54d7f5" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif">Full Stack Developer</text><text x="44" y="197" fill="#a6b6ce" font-size="16" font-weight="400" font-family="Arial,Helvetica,sans-serif">From the first pixel to the final query.</text><path d="M44 226 H936" stroke="#25354c"/><text x="44" y="252" fill="#a6b6ce" font-size="11" font-weight="700" font-family="'Courier New',monospace">ONE REQUEST. EVERY LAYER.</text><rect x="44" y="273" width="264" height="128" rx="12" fill="#111e31" stroke="#25354c"/><text x="62" y="297" fill="#54d7f5" font-size="11" font-weight="700" font-family="'Courier New',monospace">01 / FRONTEND</text><rect x="64" y="312" width="32" height="25" rx="4" fill="none" stroke="#54d7f5" stroke-width="1.5"/><path d="M64 319 h32 M75 342 h10" stroke="#54d7f5"/><text x="108" y="336" fill="#eaf2ff" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">Design the experience</text><text x="62" y="375" fill="#a6b6ce" font-size="13" font-weight="400" font-family="'Courier New',monospace">React / TypeScript</text><rect x="358" y="273" width="264" height="128" rx="12" fill="#111e31" stroke="#25354c"/><text x="376" y="297" fill="#b99aff" font-size="11" font-weight="700" font-family="'Courier New',monospace">02 / BACKEND</text><text x="377" y="337" fill="#b99aff" font-size="25" font-weight="700" font-family="'Courier New',monospace">{ }</text><text x="422" y="336" fill="#eaf2ff" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">Connect the logic</text><text x="376" y="375" fill="#a6b6ce" font-size="13" font-weight="400" font-family="'Courier New',monospace">Node.js / Express</text><rect x="672" y="273" width="264" height="128" rx="12" fill="#111e31" stroke="#25354c"/><text x="690" y="297" fill="#63e5b5" font-size="11" font-weight="700" font-family="'Courier New',monospace">03 / DATABASE</text><ellipse cx="708" cy="316" rx="15" ry="5" fill="none" stroke="#63e5b5"/><path d="M693 316 v20 c0 7 30 7 30 0 v-20 M693 326 c0 7 30 7 30 0" fill="none" stroke="#63e5b5"/><text x="736" y="336" fill="#eaf2ff" font-size="14" font-weight="700" font-family="Arial,Helvetica,sans-serif">Give data structure</text><text x="690" y="375" fill="#a6b6ce" font-size="13" font-weight="400" font-family="'Courier New',monospace">PostgreSQL / Supabase</text><path d="M308 337 h50 m-7 -5 l7 5 -7 5" fill="none" stroke="#a6b6ce" stroke-width="1.5"/><path d="M622 337 h50 m-7 -5 l7 5 -7 5" fill="none" stroke="#a6b6ce" stroke-width="1.5"/><path d="M804 401 V429 H176 V401" fill="none" stroke="#25354c" stroke-width="2"/><path d="M171 408 l5 -7 5 7" fill="none" stroke="#a6b6ce"/><g transform="translate(308 337)"><circle class="packet" r="4" fill="#54d7f5"><animateMotion dur="6s" repeatCount="indefinite" path="M0 0 H50 M314 0 H364 M496 64 V92 H-132 V64"/></circle></g><rect x="413" y="420" width="154" height="18" rx="9" fill="#0b1220"/><text x="427" y="433" fill="#63e5b5" font-size="10" font-weight="700" font-family="'Courier New',monospace">RESPONSE / 200 OK</text><text x="44" y="479" fill="#a6b6ce" font-size="13" font-weight="400" font-family="'Courier New',monospace">&gt; understand. build. refine.</text><rect class="cursor" x="280" y="468" width="8" height="14" fill="#54d7f5"/><text x="730" y="479" fill="#a6b6ce" font-size="11" font-weight="400" font-family="'Courier New',monospace">UI  /  API  /  DATA</text>
</svg>
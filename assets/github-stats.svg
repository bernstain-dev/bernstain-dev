<svg xmlns="http://www.w3.org/2000/svg" width="980" height="328" viewBox="0 0 980 328" role="img" aria-labelledby="title desc">
<title id="title">GitHub public profile statistics</title><desc id="desc">Public repositories, followers, and stars. Languages are counted by primary language in owned public non-fork repositories. Updated 2026-10-09 / UTC</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M 28 0 L 0 0 0 28" fill="none" stroke="#25354c" stroke-width="0.6" opacity="0.25"/></pattern>
  <linearGradient id="accent"><stop stop-color="#54d7f5"/><stop offset="0.55" stop-color="#b99aff"/><stop offset="1" stop-color="#63e5b5"/></linearGradient>
</defs>
<style>
 .cursor { animation: blink 1.3s steps(1) infinite; }
 .status { animation: pulse 3s ease-in-out infinite; }
 @keyframes blink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
 @keyframes pulse { 0%,100% { opacity:0.6 } 50% { opacity:1 } }
 @media (prefers-reduced-motion: reduce) { .cursor,.status { animation:none; } .packet { display:none; } }
</style>
